*{margin:0;padding:0;box-sizing:border-box;}
:root{--ink:#2f2f2e;--muted:#7c7b76;--orange:#ef7d1a;--panel:#f7f6f4;}

.plaque{
  width:210mm;height:300mm;position:relative;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 0%, #ffffff 0%, #f4f2ef 60%, #eceae6 100%);
  font-family:'Q',sans-serif;
}
.frame{position:absolute;inset:9mm;border:0.7mm solid #e3e0da;border-radius:3mm;pointer-events:none;}
.frame::after{content:"";position:absolute;inset:1.6mm;border:0.25mm solid #edeae5;border-radius:2mm;}
.content{position:absolute;inset:9mm;display:flex;flex-direction:column;align-items:center;
  padding:20mm 16mm 14mm;text-align:center;}
.logo{width:82mm;height:auto;margin-top:6mm;filter:drop-shadow(0 3mm 6mm rgba(0,0,0,.10));}
.wm{width:120mm;height:auto;margin-top:14mm;}
.accent{width:26mm;height:1.6mm;background:var(--orange);border-radius:2mm;margin-top:9mm;}
.company{margin-top:7mm;font-weight:700;color:var(--ink);font-size:12.5mm;letter-spacing:1.2mm;}
.spacer{flex:1 1 auto;}
.hair{width:60mm;height:0.35mm;background:#d8d5cf;}
.tag{margin-top:6mm;font-weight:500;color:var(--muted);font-size:5mm;letter-spacing:0.8mm;}
.web{margin-top:6mm;font-weight:700;color:var(--orange);font-size:5.5mm;letter-spacing:1mm;}

html,body{margin:0;background:#fff;}
